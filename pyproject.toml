[project]
name = "invoice-pilot"
version = "0.1.0"
description = "Telegram bot that extracts invoice data with an LLM and validates it with deterministic rules."
readme = "README.md"
license = "MIT"
authors = [{ name = "Vladimir K" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1,<1.0",
    "pydantic>=2.13,<2.14",
    "pypdf>=6.21,<7",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.8",
    "pillow>=13.0.0",
    "pytest",
    "reportlab>=5.1.0",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["invoice_pilot", "evalgen", "evalrun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["eval"]
